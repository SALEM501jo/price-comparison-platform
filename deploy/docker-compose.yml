# Production stack. The compose file in the repo root is DEVELOPMENT ONLY --
# it publishes Postgres on 5432 and Redis on 6379 with the password "postgres",
# which is fine on a laptop behind a router and catastrophic on a public VPS.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Five services: the database, the cache, a one-shot migration, the API (which
# also serves the built SPA), the scrape worker, and Caddy for TLS.
#
# THE SETTINGS FILE MUST BE NAMED EXACTLY deploy/.env -- not .env.production,
# not anything descriptive. Two different mechanisms read it:
#
#   env_file: .env    passes the variables INTO the api/migrate/worker containers
#   ${POSTGRES_USER}  is substituted into THIS FILE by compose itself, and that
#                     substitution only ever reads a file literally called .env
#                     in the project directory
#
# Name it anything else and the containers still get their settings, so it
# looks configured -- but postgres receives a BLANK password and refuses to
# initialise, and Caddy receives a BLANK domain and gets no certificate.
# Compose's only complaint is a "variable is not set" warning that scrolls
# past in the build output.

name: ahsan-se3r

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NO `ports:`. THIS IS THE WHOLE DIFFERENCE from the dev compose. Published
    # ports on a VPS bind 0.0.0.0 and punch straight through the host firewall
    # on most distributions, so a published 5432 is a database open to the
    # internet. Every service that needs it is on this network and reaches it
    # by name.
    healthcheck:
      # The $$ is escaped for compose, so the shell inside the container
      # expands it rather than compose expanding it at parse time.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # PERSISTENCE OFF, deliberately. Everything here is derivable or
    # short-lived: cached search responses, rate-limit counters, and OAuth
    # state tokens that live ten minutes. Losing the lot on a restart costs a
    # cold cache and fails any sign-in that was mid-flight, which is correct --
    # a restored state token is a replayable one.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # A ONE-SHOT, NOT A STEP INSIDE THE API's ENTRYPOINT. Two API replicas
  # starting together would otherwise run `alembic upgrade` concurrently
  # against one database. Here the API waits for this to exit 0, so a failed
  # migration stops the deploy instead of starting an app against a schema it
  # does not match.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No published ports: Caddy is the only thing that reaches it, over the
    # compose network. Nothing binds a host port but Caddy's 80 and 443.
    expose:
      - "8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The scrape queue. Separate from the API because a long scrape must not
    # occupy a request worker, and because this can be stopped and restarted
    # without taking the site down.
    command: ["python", "-m", "app.services.worker", "--loop"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # QUIC/HTTP3. Harmless if the host firewall drops it.
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data HOLDS THE CERTIFICATES. Lose this volume and every restart
      # re-requests them from Let's Encrypt, whose rate limit is 5 per domain
      # per week -- so a few careless `down -v` cycles lock the site out of
      # HTTPS for days.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
