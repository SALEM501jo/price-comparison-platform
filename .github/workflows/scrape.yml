name: Scrape prices

# Runs the real scrapers on a schedule and writes to the production database.
#
# WHY A SCHEDULED JOB RATHER THAN A PROCESS IN THE APP: scraping is bursty,
# slow by design (requests are spaced out to be polite), and entirely
# independent of serving requests. Running it in the API process would mean
# paying for that memory around the clock and having every deploy interrupt a
# run mid-flight.

on:
  schedule:
    # Every six hours. Retail prices do not move minute to minute, and each run
    # is deliberately slow, so more often would be load on the stores for no
    # extra signal.
    - cron: "0 */6 * * *"
  # Manual runs from the Actions tab, for testing or after a store changes.
  workflow_dispatch:
    inputs:
      store:
        description: "Store code to scrape (blank = all)"
        required: false
        type: string

# One run at a time. Two concurrent runs would race on the same rows, and the
# unique constraints would turn that into failed inserts rather than duplicates
# -- correct, but noisy and pointless.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      # Real credentials, from repository secrets. Never inline.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      ENVIRONMENT: production
      # Alert notifications go out at the end of the run, so this job
      # needs real mail credentials. Set EMAIL_BACKEND=null to run the
      # scrape without notifying anyone.
      EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND || 'null' }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fail early if the database is not configured
        # Without this the run reaches the scrape, hits the stores, and only
        # then fails on the write -- rude to the retailers for no benefit.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set; nothing to write to." >&2
            exit 1
          fi

      - name: Apply migrations
        run: alembic upgrade head

      - name: Scrape
        run: |
          if [ -n "${{ inputs.store }}" ]; then
            python -c "
          from app.database import SessionLocal
          from app.logging_config import setup_logging
          from app.services.ingest import IngestService
          from app.services.scrapers import store_by_code
          setup_logging()
          db = SessionLocal()
          try:
              config = store_by_code('${{ inputs.store }}')
              if not config:
                  raise SystemExit('unknown store code')
              print(IngestService(db).run_store(config))
          finally:
              db.close()
          "
          else
            python -m app.services.ingest
          fi

      - name: Merge any duplicate products the run created
        # New listings can land as separate canonical products before enough
        # attributes are known to link them. Cheap to run, and it keeps the
        # price comparison from fragmenting across near-identical rows.
        run: python scripts/merge_duplicates.py
