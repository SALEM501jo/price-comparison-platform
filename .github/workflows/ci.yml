name: CI

on:
  push:
    branches: [main, frontend]
  pull_request:
  schedule:
    # Weekly. A dependency audit that only runs on push tells you nothing about
    # the CVE published the day after your last commit.
    - cron: "0 6 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: price_comparison
        ports: ["5432:5432"]
        # Without a health check the job races the container and fails
        # intermittently on connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/price_comparison
      REDIS_URL: redis://localhost:6379/0
      # Test-only value. Real secrets come from repository secrets; this exists
      # so Settings validates, and it satisfies the 32-character minimum.
      JWT_SECRET_KEY: ci_only_secret_not_used_anywhere_real_0123456789
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:5173
      # No mail leaves CI. 'null' discards messages; 'console' would work
      # too but floods the job log with full email bodies.
      EMAIL_BACKEND: "null"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Migrations apply cleanly from an empty database
        # Catches a migration that only works against a database that already
        # has the tables -- exactly the state a developer's machine is in.
        run: alembic upgrade head

      - name: Migrations reverse cleanly
        run: alembic downgrade base

      - name: Smoke test against a running stack
        run: |
          alembic upgrade head
          python -m app.services.scraper
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-server-header &
          python - <<'PY'
          import time, httpx, sys
          for _ in range(40):
              try:
                  httpx.get("http://127.0.0.1:8000/health", timeout=2)
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          sys.exit("server never became ready")
          PY
          python scripts/smoke_test.py

      - name: Dependency audit
        # No `continue-on-error`: a known CVE in a dependency should fail the
        # build, not add a warning nobody reads.
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
