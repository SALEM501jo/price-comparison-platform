<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<!-- The price tag from src/components/layout/Logo.jsx (same path, scaled), white
     on a solid brand-green tile. A tile, not the header's green outline: the
     tab bar may be light or dark and nothing here can know which, and a thin
     green line all but vanishes on a dark bar. The tile brings its own
     background, so the white tag reads at 5.5:1 whatever the bar is; the
     tile's edge itself is ~5:1 on light bars and ~3:1 on dark ones, which is
     enough to see the square without it having to carry the mark. No
     prefers-color-scheme variant for the same reason: that query reports the
     scheme pages are asked to use, not the colour of the strip this icon is
     painted on, and a themed browser (a dark Opera GX on a light OS) is
     exactly where the two differ. The 16-unit grid puts the tag's straight edges on whole
     pixels at 16/32/48 px; the eyelet is a 2x2-pixel hole at 16 px, a touch
     larger than the header's dot so it survives that size. -->
<rect width="16" height="16" rx="3" fill="#057854"/>
<path fill="#fff" transform="translate(.9850 .9850) scale(.4375)" d="M17.4 3.2 28.8 14.6a3 3 0 0 1 0 4.24l-9.96 9.96a3 3 0 0 1-4.24 0L3.2 17.4A3 3 0 0 1 2.32 15.28V5.32A3 3 0 0 1 5.32 2.32h9.96a3 3 0 0 1 2.12.88Z"/>
<circle cx="5" cy="5" r="1.15" fill="#057854"/>
</svg>
