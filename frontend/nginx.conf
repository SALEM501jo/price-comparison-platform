server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: /results, /product/3 and /verify-email exist only in
    # the React router. Without this, a refresh or a link opened from an email
    # asks nginx for a file that is not there and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely. index.html must NOT be -- it is what points at the
    # current hashes, and a cached copy pins users to a stale build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API sets its own security headers; these cover the static host.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
